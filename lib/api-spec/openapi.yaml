openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ledgerflow
    description: Accounting workflow operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /clients:
    get:
      operationId: getClients
      tags: [ledgerflow]
      summary: List client workspaces
      responses:
        "200":
          description: Client workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [ledgerflow]
      summary: Create a client workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [ledgerflow]
      summary: Update a client workspace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateInput"
      responses:
        "200":
          description: Client workspace updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /ledgerflow/exchange-rates:
    get:
      operationId: getExchangeRates
      tags: [ledgerflow]
      summary: List the authenticated workspace exchange-rate schedule
      responses:
        "200":
          description: Workspace exchange rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExchangeRate"
    post:
      operationId: createExchangeRate
      tags: [ledgerflow]
      summary: Add a dated workspace exchange rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateInput"
      responses:
        "201":
          description: Exchange rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
  /ledgerflow/exchange-rates/{id}:
    patch:
      operationId: updateExchangeRate
      tags: [ledgerflow]
      summary: Edit a dated workspace exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateUpdate"
      responses:
        "200":
          description: Exchange rate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
    delete:
      operationId: deleteExchangeRate
      tags: [ledgerflow]
      summary: Remove a dated workspace exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Exchange rate deleted
  /ledgerflow/exchange-rates/import:
    post:
      operationId: importExchangeRates
      tags: [ledgerflow]
      summary: Import dated workspace exchange rates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateImportInput"
      responses:
        "200":
          description: Exchange rates imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateImportResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ledgerflow/overview:
    get:
      operationId: getLedgerOverview
      tags: [ledgerflow]
      summary: Get bookkeeping workflow overview
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Current workflow summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerOverview"
  /ledgerflow/bank-accounts:
    get:
      operationId: getBankAccounts
      tags: [ledgerflow]
      summary: List a client's bank accounts
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Client bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankAccount"
    post:
      operationId: createBankAccount
      tags: [ledgerflow]
      summary: Create a client bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountInput"
      responses:
        "201":
          description: Client bank account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
  /ledgerflow/statement-lines:
    get:
      operationId: getStatementLines
      tags: [ledgerflow]
      summary: List bank statement lines
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
        - name: currency
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Bank statement lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementLine"
    post:
      operationId: createStatementLine
      tags: [ledgerflow]
      summary: Add a bank statement line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementLineInput"
      responses:
        "201":
          description: Statement line created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementLine"
  /ledgerflow/import-statement:
    post:
      operationId: importStatement
      tags: [ledgerflow]
      summary: Extract statement lines from a PDF, CSV, or Excel file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementImportInput"
      responses:
        "200":
          description: The statement was already imported or contained only duplicate lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementImportResult"
        "201":
          description: Statement lines extracted and queued for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementImportResult"
  /ledgerflow/ai-chat:
    post:
      operationId: askLedgerflowAI
      tags: [ledgerflow]
      summary: Ask the AI assistant about a client workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIChatInput"
      responses:
        "200":
          description: Workspace-aware AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatResponse"
  /ledgerflow/ai-settings:
    get:
      operationId: getLedgerflowAISettings
      tags: [ledgerflow]
      summary: Get redacted AI provider settings for a client workspace
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Redacted provider configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderSettings"
    put:
      operationId: updateLedgerflowAISettings
      tags: [ledgerflow]
      summary: Select an AI provider and optionally add or rotate its API credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProviderSettingsInput"
      responses:
        "200":
          description: Redacted provider configuration saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderSettings"
  /ledgerflow/ai-settings/test:
    post:
      operationId: testLedgerflowAISettings
      tags: [ledgerflow]
      summary: Test the selected AI provider without returning its credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProviderSettingsTestInput"
      responses:
        "200":
          description: Provider test completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderSettings"
  /ledgerflow/ai-settings/credential:
    delete:
      operationId: removeLedgerflowAICredential
      tags: [ledgerflow]
      summary: Remove the workspace-owned AI credential and return to managed OpenAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProviderSettingsTestInput"
      responses:
        "200":
          description: Credential removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderSettings"
  /ledgerflow/ai-actions/confirm:
    post:
      operationId: confirmAICopilotAction
      tags: [ledgerflow]
      summary: Apply a user-confirmed AI bookkeeping proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AICopilotActionInput"
      responses:
        "200":
          description: AI action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AICopilotActionResult"
  /ledgerflow/bulk-transition-audits:
    get:
      operationId: getBulkTransitionAudits
      tags: [ledgerflow]
      summary: List confirmed bulk ledger transitions
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Immutable bulk transition confirmation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkTransitionAudit"
  /ledgerflow/journal-entries:
    get:
      operationId: getJournalEntries
      tags: [ledgerflow]
      summary: List journal entries
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
  /ledgerflow/journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [ledgerflow]
      summary: Approve a suggested journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveJournalEntryInput"
      responses:
        "200":
          description: Approved journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
  /ledgerflow/journal-entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags: [ledgerflow]
      summary: Post an approved journal entry to the ledger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveJournalEntryInput"
      responses:
        "200":
          description: Posted journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "409":
          description: Journal entry must be approved before posting
  /ledgerflow/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [ledgerflow]
      summary: Get trial balance
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrialBalanceRow"
  /ledgerflow/financial-statements:
    get:
      operationId: getFinancialStatements
      tags: [ledgerflow]
      summary: Get financial statement reports
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Income statement, balance sheet, and indirect cash flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialStatements"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Client:
      type: object
      required: [id, name, legalName, functionalCurrency, basis, period]
      properties:
        id: { type: number }
        name: { type: string }
        legalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
    ClientInput:
      type: object
      required: [name, legalName]
      properties:
        name: { type: string }
        legalName: { type: string }
    ClientUpdateInput:
      type: object
      required: [name, legalName, functionalCurrency, basis, period]
      properties:
        name: { type: string }
        legalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
    ExchangeRate:
      type: object
      required: [id, sourceCurrency, functionalCurrency, effectiveDate, rate, source]
      properties:
        id: { type: number }
        sourceCurrency: { type: string, minLength: 3, maxLength: 3 }
        functionalCurrency: { type: string, minLength: 3, maxLength: 3 }
        effectiveDate: { type: string, format: date }
        rate: { type: number, exclusiveMinimum: 0 }
        source: { type: string }
        note: { type: ["string", "null"] }
    ExchangeRateInput:
      type: object
      required: [sourceCurrency, functionalCurrency, effectiveDate, rate]
      properties:
        sourceCurrency: { type: string, minLength: 3, maxLength: 3 }
        functionalCurrency: { type: string, minLength: 3, maxLength: 3 }
        effectiveDate: { type: string, format: date }
        rate: { type: number, exclusiveMinimum: 0 }
        source: { type: string }
        note: { type: ["string", "null"] }
    ExchangeRateUpdate:
      type: object
      required: [sourceCurrency, functionalCurrency, effectiveDate, rate]
      properties:
        sourceCurrency: { type: string, minLength: 3, maxLength: 3 }
        functionalCurrency: { type: string, minLength: 3, maxLength: 3 }
        effectiveDate: { type: string, format: date }
        rate: { type: number, exclusiveMinimum: 0 }
        source: { type: string }
        note: { type: ["string", "null"] }
    ExchangeRateImportInput:
      type: object
      required: [rates]
      properties:
        rates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExchangeRateInput"
    ExchangeRateImportResult:
      type: object
      required: [importedCount, updatedCount, rates]
      properties:
        importedCount: { type: number }
        updatedCount: { type: number }
        rates:
          type: array
          items:
            $ref: "#/components/schemas/ExchangeRate"
    LedgerOverview:
      type: object
      required: [period, currencies, totalLines, pendingReview, postedAmount, completionPercent, functionalCurrency, postedAmountFunctional, missingRateCount, missingRateCurrencies]
      properties:
        period: { type: string }
        currencies:
          type: array
          items: { type: string }
        totalLines: { type: number }
        pendingReview: { type: number }
        postedAmount: { type: number }
        completionPercent: { type: number }
        functionalCurrency: { type: string }
        postedAmountFunctional: { type: number }
        missingRateCount: { type: number }
        missingRateCurrencies:
          type: array
          items: { type: string }
    StatementLine:
      type: object
      required: [id, date, description, currency, amount, direction, status, source]
      properties:
        id: { type: number }
        bankAccountId: { type: ["number", "null"] }
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
        status: { type: string }
        source: { type: string }
        accountSuggestion: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        suggestionSource: { type: string, enum: [ai, heuristic, workspace_learning] }
        supportingPatternCount: { type: number }
        functionalCurrency: { type: ["string", "null"] }
        functionalAmount: { type: ["number", "null"] }
        exchangeRate: { type: ["number", "null"] }
        exchangeRateEffectiveDate: { type: ["string", "null"], format: date }
        exchangeRateStatus: { type: string }
    StatementLineInput:
      type: object
      required: [date, description, currency, amount, direction]
      properties:
        clientId: { type: number }
        bankAccountId: { type: ["number", "null"] }
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
    StatementImportInput:
      type: object
      required: [clientId, fileName, mimeType, objectPath, currency]
      properties:
        clientId: { type: number }
        bankAccountId: { type: ["number", "null"] }
        fileName: { type: string }
        mimeType: { type: string }
        objectPath: { type: string }
        currency: { type: string }
    StatementImportResult:
      type: object
      required: [fileName, importStatus, importedCount, duplicateCount, duplicateLines, lines]
      properties:
        fileName: { type: string }
        importStatus: { type: string, enum: [imported, imported_with_duplicates, duplicates_found, duplicate_file] }
        message: { type: string }
        importedCount: { type: number }
        duplicateCount: { type: number }
        duplicateLines:
          type: array
          items:
            $ref: "#/components/schemas/StatementImportDuplicate"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StatementLine"
        bankAccount:
          oneOf:
            - $ref: "#/components/schemas/BankAccount"
            - type: "null"
    StatementImportDuplicate:
      type: object
      required: [date, description, currency, amount, direction, existingLineId, reason]
      properties:
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
        existingLineId: { type: ["number", "null"] }
        reason: { type: string, enum: [already_imported, duplicate_in_file] }
    BankAccount:
      type: object
      required: [id, clientId, name, currency]
      properties:
        id: { type: number }
        clientId: { type: number }
        name: { type: string }
        bankName: { type: ["string", "null"] }
        accountNumberLast4: { type: ["string", "null"] }
        currency: { type: string }
    BankAccountInput:
      type: object
      required: [clientId, name, currency]
      properties:
        clientId: { type: number }
        name: { type: string, minLength: 1 }
        bankName: { type: ["string", "null"] }
        accountNumberLast4: { type: ["string", "null"], pattern: "^[0-9]{4}$" }
        currency: { type: string, minLength: 3, maxLength: 3 }
    ApproveJournalEntryInput:
      type: object
      required: [clientId]
      properties:
        clientId: { type: number }
    AIChatInput:
      type: object
      required: [clientId, message]
      properties:
        clientId: { type: number }
        message: { type: string }
    AIChatResponse:
      type: object
      required: [answer, context, recommendations]
      properties:
        answer: { type: string }
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/AICopilotRecommendation"
        context:
          type: object
          required: [clientName, pendingLines, postedLines]
          properties:
            clientName: { type: string }
            pendingLines: { type: number }
            postedLines: { type: number }
    AIProvider:
      type: string
      enum: [managed_openai, openai, anthropic]
    AICredentialStatus:
      type: string
      enum: [not_configured, configured, invalid, unavailable]
    AIProviderSettings:
      type: object
      required: [clientId, provider, model, credentialStatus, credentialLast4, credentialUpdatedAt, lastTestedAt, availableModels]
      properties:
        clientId: { type: number }
        provider: { $ref: "#/components/schemas/AIProvider" }
        model: { type: string }
        credentialStatus: { $ref: "#/components/schemas/AICredentialStatus" }
        credentialLast4: { type: ["string", "null"], description: "Last four characters only; never the API credential." }
        credentialUpdatedAt: { type: ["string", "null"], format: date-time }
        lastTestedAt: { type: ["string", "null"], format: date-time }
        availableModels:
          type: array
          items: { type: string }
    AIProviderSettingsInput:
      type: object
      required: [clientId, provider, model]
      properties:
        clientId: { type: number }
        provider: { $ref: "#/components/schemas/AIProvider" }
        model: { type: string }
        apiKey: { type: string, minLength: 1, writeOnly: true }
    AIProviderSettingsTestInput:
      type: object
      required: [clientId]
      properties:
        clientId: { type: number }
    AICopilotRecommendation:
      type: object
      required: [id, clientId, type, title, summary, requiresConfirmation]
      properties:
        id: { type: string }
        clientId: { type: number }
        type: { type: string, enum: [next_step, review_group, recode_lines, create_bank_account, bulk_approve_entries, bulk_post_entries] }
        title: { type: string }
        summary: { type: string }
        lineIds:
          type: array
          items: { type: number }
        entryIds:
          type: array
          items: { type: number }
        statementLineIds:
          type: array
          items: { type: number }
        entryCount: { type: number }
        lineCount: { type: number }
        fromStatus: { type: string }
        toStatus: { type: string }
        statusTransition:
          type: object
          required: [from, to]
          properties:
            from: { type: string }
            to: { type: string }
        accountSuggestion: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        suggestionSource: { type: string, enum: [ai, heuristic, workspace_learning] }
        supportingPatternCount: { type: number }
        bankAccount:
          oneOf:
            - $ref: "#/components/schemas/BankAccountDraft"
            - type: "null"
        requiresConfirmation: { type: boolean }
    BankAccountDraft:
      type: object
      required: [name, currency]
      properties:
        name: { type: string }
        bankName: { type: ["string", "null"] }
        accountNumberLast4: { type: ["string", "null"], pattern: "^[0-9]{4}$" }
        currency: { type: string }
    AICopilotActionInput:
      type: object
      required: [clientId, type]
      properties:
        clientId: { type: number }
        type: { type: string, enum: [recode_lines, create_bank_account, bulk_approve_entries, bulk_post_entries] }
        lineIds:
          type: array
          items: { type: number }
          maxItems: 100
        entryIds:
          type: array
          items: { type: number }
          maxItems: 100
        statementLineIds:
          type: array
          items: { type: number }
          maxItems: 100
        accountSuggestion: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        bankAccount:
          oneOf:
            - $ref: "#/components/schemas/BankAccountDraft"
            - type: "null"
    AICopilotActionResult:
      type: object
      required: [type, updatedLineCount, bankAccount]
      properties:
        type: { type: string }
        clientId: { type: number }
        entryIds:
          type: array
          items: { type: number }
        statementLineIds:
          type: array
          items: { type: number }
        entryCount: { type: number }
        lineCount: { type: number }
        fromStatus: { type: string }
        toStatus: { type: string }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
        updatedLineCount: { type: number }
        bankAccount:
          oneOf:
            - $ref: "#/components/schemas/BankAccount"
            - type: "null"
    BulkTransitionAudit:
      type: object
      required: [id, clientId, actor, transition, fromStatus, toStatus, entryIds, statementLineIds, confirmedAt]
      properties:
        id: { type: number }
        clientId: { type: number }
        actor:
          $ref: "#/components/schemas/BulkTransitionAuditActor"
        transition: { type: string, enum: [bulk_approve_entries, bulk_post_entries] }
        fromStatus: { type: string }
        toStatus: { type: string }
        entryIds:
          type: array
          items: { type: number }
        statementLineIds:
          type: array
          items: { type: number }
        confirmedAt: { type: string, format: date-time }
    BulkTransitionAuditActor:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: ["string", "null"] }
    JournalLine:
      type: object
      required: [account, debit, credit]
      properties:
        account: { type: string }
        debit: { type: number }
        credit: { type: number }
    JournalEntry:
      type: object
      required: [id, statementLineId, date, memo, currency, status, confidence, lines]
      properties:
        id: { type: number }
        statementLineId: { type: number }
        date: { type: string }
        memo: { type: string }
        currency: { type: string }
        status: { type: string }
        confidence: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalLine" }
        functionalCurrency: { type: ["string", "null"] }
        functionalAmount: { type: ["number", "null"] }
        exchangeRate: { type: ["number", "null"] }
        exchangeRateEffectiveDate: { type: ["string", "null"], format: date }
        exchangeRateStatus: { type: string }
    TrialBalanceRow:
      type: object
      required: [account, category, debit, credit, balance, functionalCurrency, missingRateCount, missingRateCurrencies]
      properties:
        account: { type: string }
        category: { type: string }
        debit: { type: number }
        credit: { type: number }
        balance: { type: number }
        functionalCurrency: { type: string }
        missingRateCount: { type: number }
        missingRateCurrencies:
          type: array
          items: { type: string }
    StatementSection:
      type: object
      required: [label, amount]
      properties:
        label: { type: string }
        amount: { type: number }
        children:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
    FinancialStatements:
      type: object
      required: [period, incomeStatement, balanceSheet, cashFlow, functionalCurrency, missingRateCount, missingRateCurrencies]
      properties:
        period: { type: string }
        functionalCurrency: { type: string }
        missingRateCount: { type: number }
        missingRateCurrencies:
          type: array
          items: { type: string }
        incomeStatement:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
        balanceSheet:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
        cashFlow:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
