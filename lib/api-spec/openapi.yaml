openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ledgerflow
    description: Accounting workflow operations
paths:
  /clients:
    get:
      operationId: getClients
      tags: [ledgerflow]
      summary: List client workspaces
      responses:
        "200":
          description: Client workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [ledgerflow]
      summary: Create a client workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [ledgerflow]
      summary: Update a client workspace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateInput"
      responses:
        "200":
          description: Client workspace updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ledgerflow/overview:
    get:
      operationId: getLedgerOverview
      tags: [ledgerflow]
      summary: Get bookkeeping workflow overview
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Current workflow summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerOverview"
  /ledgerflow/statement-lines:
    get:
      operationId: getStatementLines
      tags: [ledgerflow]
      summary: List bank statement lines
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
        - name: currency
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Bank statement lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementLine"
    post:
      operationId: createStatementLine
      tags: [ledgerflow]
      summary: Add a bank statement line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementLineInput"
      responses:
        "201":
          description: Statement line created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementLine"
  /ledgerflow/import-statement:
    post:
      operationId: importStatement
      tags: [ledgerflow]
      summary: Extract statement lines from a PDF, CSV, or Excel file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementImportInput"
      responses:
        "201":
          description: Statement lines extracted and queued for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementImportResult"
  /ledgerflow/ai-chat:
    post:
      operationId: askLedgerflowAI
      tags: [ledgerflow]
      summary: Ask the AI assistant about a client workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIChatInput"
      responses:
        "200":
          description: Workspace-aware AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatResponse"
  /ledgerflow/journal-entries:
    get:
      operationId: getJournalEntries
      tags: [ledgerflow]
      summary: List journal entries
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
  /ledgerflow/journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [ledgerflow]
      summary: Approve a suggested journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveJournalEntryInput"
      responses:
        "200":
          description: Approved journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
  /ledgerflow/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [ledgerflow]
      summary: Get trial balance
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrialBalanceRow"
  /ledgerflow/financial-statements:
    get:
      operationId: getFinancialStatements
      tags: [ledgerflow]
      summary: Get financial statement reports
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Income statement, balance sheet, and indirect cash flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialStatements"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Client:
      type: object
      required: [id, name, legalName, functionalCurrency, basis, period]
      properties:
        id: { type: number }
        name: { type: string }
        legalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
    ClientInput:
      type: object
      required: [name, legalName]
      properties:
        name: { type: string }
        legalName: { type: string }
    ClientUpdateInput:
      type: object
      required: [name, legalName, functionalCurrency, basis, period]
      properties:
        name: { type: string }
        legalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
    LedgerOverview:
      type: object
      required: [period, currencies, totalLines, pendingReview, postedAmount, completionPercent]
      properties:
        period: { type: string }
        currencies:
          type: array
          items: { type: string }
        totalLines: { type: number }
        pendingReview: { type: number }
        postedAmount: { type: number }
        completionPercent: { type: number }
    StatementLine:
      type: object
      required: [id, date, description, currency, amount, direction, status, source]
      properties:
        id: { type: number }
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
        status: { type: string }
        source: { type: string }
        accountSuggestion: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
    StatementLineInput:
      type: object
      required: [date, description, currency, amount, direction]
      properties:
        clientId: { type: number }
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
    StatementImportInput:
      type: object
      required: [clientId, fileName, mimeType, contentBase64, currency]
      properties:
        clientId: { type: number }
        fileName: { type: string }
        mimeType: { type: string }
        contentBase64: { type: string }
        currency: { type: string }
    StatementImportResult:
      type: object
      required: [fileName, importedCount, lines]
      properties:
        fileName: { type: string }
        importedCount: { type: number }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StatementLine"
    ApproveJournalEntryInput:
      type: object
      required: [clientId]
      properties:
        clientId: { type: number }
    AIChatInput:
      type: object
      required: [clientId, message]
      properties:
        clientId: { type: number }
        message: { type: string }
    AIChatResponse:
      type: object
      required: [answer, context]
      properties:
        answer: { type: string }
        context:
          type: object
          required: [clientName, pendingLines, postedLines]
          properties:
            clientName: { type: string }
            pendingLines: { type: number }
            postedLines: { type: number }
    JournalLine:
      type: object
      required: [account, debit, credit]
      properties:
        account: { type: string }
        debit: { type: number }
        credit: { type: number }
    JournalEntry:
      type: object
      required: [id, statementLineId, date, memo, currency, status, confidence, lines]
      properties:
        id: { type: number }
        statementLineId: { type: number }
        date: { type: string }
        memo: { type: string }
        currency: { type: string }
        status: { type: string }
        confidence: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalLine" }
    TrialBalanceRow:
      type: object
      required: [account, category, debit, credit, balance]
      properties:
        account: { type: string }
        category: { type: string }
        debit: { type: number }
        credit: { type: number }
        balance: { type: number }
    StatementSection:
      type: object
      required: [label, amount]
      properties:
        label: { type: string }
        amount: { type: number }
        children:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
    FinancialStatements:
      type: object
      required: [period, incomeStatement, balanceSheet, cashFlow]
      properties:
        period: { type: string }
        incomeStatement:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
        balanceSheet:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
        cashFlow:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }

