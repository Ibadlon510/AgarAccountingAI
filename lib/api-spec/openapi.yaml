openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ledgerflow
    description: Accounting workflow operations
  - name: auth
    description: Browser and mobile authentication endpoints
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /ledgerflow/account-profile:
    patch:
      operationId: updateLedgerflowAccountProfile
      tags: [ledgerflow]
      summary: Save the authenticated account owner's AgarAccounting AI System profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileInput"
      responses:
        "200":
          description: Account profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
  /workspace/firm-profile:
    get:
      operationId: getFirmProfile
      tags: [ledgerflow]
      summary: Get the bookkeeping firm's shared profile
      responses:
        "200":
          description: Firm profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmProfile"
    patch:
      operationId: updateFirmProfile
      tags: [ledgerflow]
      summary: Update the bookkeeping firm's shared identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmProfileInput"
      responses:
        "200":
          description: Firm profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmProfile"
  /organizations/context:
    get:
      operationId: getOrganizationContext
      tags: [ledgerflow]
      summary: Get the authenticated user's company and accounting-firm context
      responses:
        "200":
          description: Organization context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
  /organizations/onboarding:
    post:
      operationId: completeOrganizationOnboarding
      tags: [ledgerflow]
      summary: Complete company, accounting-firm, or dual onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationOnboardingInput"
      responses:
        "200":
          description: Organization onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
  /firms/{id}/invitations:
    post:
      operationId: inviteFirmMember
      tags: [ledgerflow]
      summary: Invite a member to an accounting firm
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInviteInput"
      responses:
        "201":
          description: Firm invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitation"
  /companies/{id}/firm-invitations:
    post:
      operationId: inviteAccountingFirm
      tags: [ledgerflow]
      summary: Invite an accounting firm administrator to serve a company
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmEngagementInviteInput"
      responses:
        "201":
          description: Accounting-firm invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitation"
  /companies/{id}/transfer-invitations:
    post:
      operationId: inviteCompanyOwnerTransfer
      tags: [ledgerflow]
      summary: Invite a client owner to accept a firm-created company
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInviteInput"
      responses:
        "201":
          description: Company transfer invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitation"
  /organization-invitations/{token}/accept:
    post:
      operationId: acceptOrganizationInvitation
      tags: [ledgerflow]
      summary: Accept a firm, engagement, or company-transfer invitation
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
  /engagements/{id}/nominations:
    post:
      operationId: nominateFirmEngagementMember
      tags: [ledgerflow]
      summary: Nominate a firm member for company access
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmNominationInput"
      responses:
        "200":
          description: Engagement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmEngagement"
  /engagements/{id}/nominations/{userId}/approve:
    post:
      operationId: approveFirmEngagementMember
      tags: [ledgerflow]
      summary: Approve a nominated firm member for company access
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Engagement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmEngagement"
  /engagements/{id}/members/{userId}:
    delete:
      operationId: revokeFirmEngagementMember
      tags: [ledgerflow]
      summary: Revoke one firm's access to a company
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Firm-member access revoked
  /engagements/{id}:
    delete:
      operationId: revokeFirmEngagement
      tags: [ledgerflow]
      summary: End an accounting-firm engagement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Engagement revoked
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [auth]
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [auth]
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect back to the safe in-app location
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [auth]
      summary: Clear the session and begin OIDC logout
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string, default: / }
      responses:
        "302":
          description: Redirect to the OIDC provider logout endpoint
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [auth]
      summary: Exchange a mobile OIDC authorization code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [auth]
      summary: Delete a mobile session token
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /clients:
    get:
      operationId: getClients
      tags: [ledgerflow]
      summary: List client workspaces
      responses:
        "200":
          description: Client workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [ledgerflow]
      summary: Create a client workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [ledgerflow]
      summary: Update a client workspace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateInput"
      responses:
        "200":
          description: Client workspace updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /workspace/members:
    get:
      operationId: getWorkspaceMembers
      tags: [ledgerflow]
      summary: Review workspace members and invitations
      responses:
        "200":
          description: Workspace membership and client access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembers"
  /workspace/members/{userId}:
    patch:
      operationId: updateWorkspaceMember
      tags: [ledgerflow]
      summary: Update a member role and client access
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberUpdate"
      responses:
        "200":
          description: Updated workspace member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
    delete:
      operationId: removeWorkspaceMember
      tags: [ledgerflow]
      summary: Remove a workspace member
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Member removed
  /workspace/invitations:
    post:
      operationId: createWorkspaceInvitation
      tags: [ledgerflow]
      summary: Invite a teammate to the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
  /workspace/invitations/{id}:
    delete:
      operationId: revokeWorkspaceInvitation
      tags: [ledgerflow]
      summary: Revoke a pending workspace invitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Invitation revoked
  /workspace/invitations/{id}/resend:
    post:
      operationId: resendWorkspaceInvitation
      tags: [ledgerflow]
      summary: Resend a pending workspace invitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Invitation resent with a newly rotated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
  /workspace/invitations/{token}/accept:
    post:
      operationId: acceptWorkspaceInvitation
      tags: [ledgerflow]
      summary: Accept a workspace invitation
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
  /ledgerflow/usage:
    get:
      operationId: getLedgerflowUsage
      tags: [ledgerflow]
      summary: Get server-measured workspace usage and plan limits
      responses:
        "200":
          description: Workspace usage and retention policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUsage"
  /ledgerflow/exchange-rates:
    get:
      operationId: getExchangeRates
      tags: [ledgerflow]
      summary: List the authenticated workspace exchange-rate schedule
      parameters:
        - $ref: "#/components/parameters/RateScopeClientId"
        - $ref: "#/components/parameters/RateScopeFirmId"
      responses:
        "200":
          description: Workspace exchange rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExchangeRate"
    post:
      operationId: createExchangeRate
      tags: [ledgerflow]
      summary: Add a dated workspace exchange rate
      parameters:
        - $ref: "#/components/parameters/RateScopeClientId"
        - $ref: "#/components/parameters/RateScopeFirmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateInput"
      responses:
        "201":
          description: Exchange rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
  /ledgerflow/exchange-rates/{id}:
    patch:
      operationId: updateExchangeRate
      tags: [ledgerflow]
      summary: Edit a dated workspace exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateUpdate"
      responses:
        "200":
          description: Exchange rate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
    delete:
      operationId: deleteExchangeRate
      tags: [ledgerflow]
      summary: Remove a dated workspace exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Exchange rate deleted
  /ledgerflow/exchange-rates/import:
    post:
      operationId: importExchangeRates
      tags: [ledgerflow]
      summary: Import dated workspace exchange rates
      parameters:
        - $ref: "#/components/parameters/RateScopeClientId"
        - $ref: "#/components/parameters/RateScopeFirmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateImportInput"
      responses:
        "200":
          description: Exchange rates imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateImportResult"
  /ledgerflow/exchange-rates/parse:
    post:
      operationId: parseExchangeRates
      tags: [ledgerflow]
      summary: Prepare an exchange-rate import preview from CSV or Excel data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateParseInput"
      responses:
        "200":
          description: Detected exchange-rate mapping and parsed preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateParseResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ledgerflow/overview:
    get:
      operationId: getLedgerOverview
      tags: [ledgerflow]
      summary: Get bookkeeping workflow overview
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Current workflow summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerOverview"
  /ledgerflow/bank-accounts:
    get:
      operationId: getBankAccounts
      tags: [ledgerflow]
      summary: List a client's bank accounts
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Client bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankAccount"
    post:
      operationId: createBankAccount
      tags: [ledgerflow]
      summary: Create a client bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountInput"
      responses:
        "201":
          description: Client bank account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
  /ledgerflow/statement-lines:
    get:
      operationId: getStatementLines
      tags: [ledgerflow]
      summary: List bank statement lines
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
        - name: currency
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Bank statement lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementLine"
    post:
      operationId: createStatementLine
      tags: [ledgerflow]
      summary: Add a bank statement line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementLineInput"
      responses:
        "201":
          description: Statement line created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementLine"
  /ledgerflow/import-statement:
    post:
      operationId: importStatement
      tags: [ledgerflow]
      summary: Extract statement lines from a PDF, CSV, or Excel file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementImportInput"
      responses:
        "200":
          description: The statement was already imported or contained only duplicate lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementImportResult"
        "201":
          description: Statement lines extracted and queued for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementImportResult"
  /ledgerflow/statement-imports:
    get:
      operationId: getStatementImports
      tags: [ledgerflow]
      summary: List statement import trail
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Authorized statement import trail
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementImport"
  /ledgerflow/statement-imports/{id}/undo:
    post:
      operationId: undoStatementImport
      tags: [ledgerflow]
      summary: Remove a review-only statement import while preserving its evidence trail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementImportUndoInput"
      responses:
        "200":
          description: Import was already undone or its review-only data was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementImportUndoResult"
        "409":
          description: The import contains accounting work that is no longer review-only
  /ledgerflow/uploaded-files:
    get:
      operationId: getUploadedFiles
      tags: [ledgerflow]
      summary: List successful uploaded statement files
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Successful statement files available to the authorized client member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedFile"
  /ledgerflow/statement-imports/{id}/source:
    get:
      operationId: getStatementImportSource
      tags: [ledgerflow]
      summary: Download an imported statement source document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Private source document
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "403":
          description: The statement is not in an accessible workspace
        "404":
          description: Source document not found
  /ledgerflow/ai-chat:
    post:
      operationId: askLedgerflowAI
      tags: [ledgerflow]
      summary: Ask the AI assistant about a client workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIChatInput"
      responses:
        "200":
          description: Workspace-aware AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatResponse"
  /ledgerflow/ai-settings:
    get:
      operationId: getLedgerflowAISettings
      tags: [ledgerflow]
      summary: Get redacted AI provider settings for a client workspace
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Redacted provider configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderSettings"
    put:
      operationId: updateLedgerflowAISettings
      tags: [ledgerflow]
      summary: Select an AI provider and optionally add or rotate its API credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProviderSettingsInput"
      responses:
        "200":
          description: Redacted provider configuration saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderSettings"
  /ledgerflow/ai-settings/test:
    post:
      operationId: testLedgerflowAISettings
      tags: [ledgerflow]
      summary: Test the selected AI provider without returning its credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProviderSettingsTestInput"
      responses:
        "200":
          description: Provider test completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderSettings"
  /ledgerflow/ai-settings/credential:
    delete:
      operationId: removeLedgerflowAICredential
      tags: [ledgerflow]
      summary: Remove the workspace-owned AI credential and return to managed OpenAI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProviderSettingsTestInput"
      responses:
        "200":
          description: Credential removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProviderSettings"
  /ledgerflow/ai-actions/confirm:
    post:
      operationId: confirmAICopilotAction
      tags: [ledgerflow]
      summary: Apply a user-confirmed AI bookkeeping proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AICopilotActionInput"
      responses:
        "200":
          description: AI action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AICopilotActionResult"
  /ledgerflow/bulk-transition-audits:
    get:
      operationId: getBulkTransitionAudits
      tags: [ledgerflow]
      summary: List immutable ledger transition history
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Immutable bulk transition confirmation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkTransitionAudit"
  /ledgerflow/journal-entries:
    get:
      operationId: getJournalEntries
      tags: [ledgerflow]
      summary: List journal entries
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
  /ledgerflow/journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [ledgerflow]
      summary: Approve a suggested journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveJournalEntryInput"
      responses:
        "200":
          description: Approved journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
  /ledgerflow/journal-entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags: [ledgerflow]
      summary: Post an approved journal entry to the ledger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveJournalEntryInput"
      responses:
        "200":
          description: Posted journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "409":
          description: Journal entry must be approved before posting
  /ledgerflow/journal-entries/{id}/unpost:
    post:
      operationId: unpostJournalEntry
      tags: [ledgerflow]
      summary: Return a posted journal entry to approved and remove it from live reports
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnpostJournalEntryInput"
      responses:
        "200":
          description: Approved journal entry removed from live reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "409":
          description: Journal entry must be posted before it can be unposted
  /ledgerflow/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [ledgerflow]
      summary: Get trial balance
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrialBalanceRow"
  /ledgerflow/financial-statements:
    get:
      operationId: getFinancialStatements
      tags: [ledgerflow]
      summary: Get financial statement reports
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Income statement, balance sheet, and indirect cash flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialStatements"
  /ledgerflow/report-packs:
    get:
      operationId: getReportPacks
      tags: [ledgerflow]
      summary: List saved IFRS report-pack snapshots
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Saved report packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportPackSummary"
    post:
      operationId: createReportPack
      tags: [ledgerflow]
      summary: Generate a comparative IFRS-style report pack snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPackInput"
      responses:
        "201":
          description: Draft report pack snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPack"
        "422":
          description: Report data cannot be generated safely
  /ledgerflow/report-packs/{id}:
    get:
      operationId: getReportPack
      tags: [ledgerflow]
      summary: Get one saved report-pack snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Report pack snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPack"
        "404":
          description: Report pack not found
    patch:
      operationId: updateReportPack
      tags: [ledgerflow]
      summary: Update report-pack inputs or finalize after review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPackUpdate"
      responses:
        "200":
          description: Updated report pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPack"
        "409":
          description: Finalization is blocked by validation or accountant inputs
  /ledgerflow/report-packs/{id}/pdf:
    get:
      operationId: downloadReportPackPdf
      tags: [ledgerflow]
      summary: Download the saved report-pack snapshot as a PDF
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: A4 report-pack PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "409":
          description: Final export is blocked until the report is finalized
        "404":
          description: Report pack not found
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for a private statement upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
        "403":
          description: Workspace access denied
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an authorized private object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "403":
          description: Object access denied
        "404":
          description: Object not found
components:
  parameters:
    RateScopeClientId:
      name: clientId
      in: query
      required: false
      schema: { type: number }
      description: Company ledger whose persisted rate profile is being managed.
    RateScopeFirmId:
      name: firmId
      in: query
      required: false
      schema: { type: number }
      description: Accounting firm whose shared rate profile is being managed.
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    AccountProfile:
      type: object
      required: [email, firstName, lastName]
      properties:
        email: { type: ["string", "null"] }
        firstName: { type: string }
        lastName: { type: string }
    AccountProfileInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
    FirmProfile:
      type: object
      required: [id, name, legalName]
      properties:
        id: { type: number }
        name: { type: string }
        legalName: { type: string }
    FirmProfileInput:
      type: object
      required: [name, legalName]
      properties:
        name: { type: string, minLength: 1 }
        legalName: { type: string, minLength: 1 }
    OrganizationMode:
      type: string
      enum: [company, firm, both]
    OrganizationRole:
      type: string
      enum: [owner, admin, accountant, bookkeeper]
    OwnershipStatus:
      type: string
      enum: [company_owned, firm_provisional]
    SubscriptionLiableParty:
      type: string
      enum: [company, firm]
    OrganizationOnboardingInput:
      type: object
      required: [mode, firstName, lastName]
      properties:
        mode: { $ref: "#/components/schemas/OrganizationMode" }
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        companyName: { type: string }
        companyLegalName: { type: string }
        firmName: { type: string }
        firmLegalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
    OrganizationInviteInput:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 3, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        role:
          type: string
          enum: [admin, accountant, bookkeeper]
    FirmEngagementInviteInput:
      type: object
      required: [email, firmId]
      properties:
        email: { type: string, minLength: 3, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        firmId: { type: number }
        role:
          type: string
          enum: [admin]
    FirmNominationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, minLength: 3, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        role:
          type: string
          enum: [accountant, bookkeeper]
    FirmMembership:
      type: object
      required: [firmId, firmName, userId, name, email, role]
      properties:
        firmId: { type: number }
        firmName: { type: string }
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/OrganizationRole" }
    FirmEngagementMember:
      type: object
      required: [userId, name, email, role, status]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [accountant, bookkeeper]
        status:
          type: string
          enum: [nominated, approved, revoked]
    FirmEngagement:
      type: object
      required: [id, firmId, firmName, clientId, companyName, status, canManageFirm, canManageCompany, members]
      properties:
        id: { type: number }
        firmId: { type: number }
        firmName: { type: string }
        clientId: { type: number }
        companyName: { type: string }
        status:
          type: string
          enum: [provisional, active, revoked]
        canManageFirm: { type: boolean }
        canManageCompany: { type: boolean }
        members:
          type: array
          items:
            $ref: "#/components/schemas/FirmEngagementMember"
    OrganizationInvitation:
      type: object
      required: [id, kind, email, status, expiresAt, createdAt]
      properties:
        id: { type: number }
        kind:
          type: string
          enum: [firm_member, firm_engagement, company_transfer]
        email: { type: string }
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        clientId: { type: ["number", "null"] }
        firmId: { type: ["number", "null"] }
        role: { type: ["string", "null"] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        inviteLink: { type: string }
    OrganizationContext:
      type: object
      required: [onboardingRequired, mode, firms, firmMembers, companies, managedCompanyIds, engagements, invitations]
      properties:
        onboardingRequired: { type: boolean }
        mode:
          oneOf:
            - $ref: "#/components/schemas/OrganizationMode"
            - type: "null"
        firms:
          type: array
          items:
            $ref: "#/components/schemas/FirmMembership"
        firmMembers:
          type: array
          items:
            $ref: "#/components/schemas/FirmMembership"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        managedCompanyIds:
          type: array
          items: { type: number }
        engagements:
          type: array
          items:
            $ref: "#/components/schemas/FirmEngagement"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationInvitation"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Client:
      type: object
      required: [id, name, legalName, functionalCurrency, basis, period, legacyDemo, workspaceState, ownershipStatus, subscriptionLiableParty]
      properties:
        id: { type: number }
        name: { type: string }
        legalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
        ownerUserId: { type: ["string", "null"] }
        firmId: { type: ["number", "null"] }
        ownershipStatus: { $ref: "#/components/schemas/OwnershipStatus" }
        subscriptionLiableParty: { $ref: "#/components/schemas/SubscriptionLiableParty" }
        legacyDemo:
          type: boolean
          description: True only for an untouched legacy demo workspace retained for reference.
        workspaceState:
          type: string
          enum: [starter, configured, legacy_demo]
          description: Configuration state for this workspace. Missing memberships are represented by an empty response.
    ClientInput:
      type: object
      required: [name, legalName]
      properties:
        name: { type: string }
        legalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
        creationMode:
          type: string
          enum: [own_company, firm_client]
        firmId: { type: number }
    ClientUpdateInput:
      type: object
      required: [name, legalName, functionalCurrency, basis, period]
      properties:
        name: { type: string }
        legalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
    WorkspaceRole:
      type: string
      enum: [owner, admin, accountant, bookkeeper]
    WorkspaceAssignableRole:
      type: string
      enum: [admin, accountant, bookkeeper]
    WorkspaceMembershipClient:
      type: object
      required: [id, name]
      properties:
        id: { type: number }
        name: { type: string }
    WorkspaceMember:
      type: object
      required: [userId, email, name, role, status, clients, isCurrentUser]
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        status: { type: string, enum: [active] }
        clients:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembershipClient"
        isCurrentUser: { type: boolean }
    WorkspaceInvitation:
      type: object
      required: [id, email, role, status, clients, invitedBy, expiresAt, createdAt]
      properties:
        id: { type: number }
        email: { type: string }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        clients:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembershipClient"
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        inviteLink: { type: string }
        emailSubject: { type: string }
        emailBody: { type: string }
    WorkspaceMembers:
      type: object
      required: [currentRole, canManage, clients, members, invitations]
      properties:
        currentRole: { $ref: "#/components/schemas/WorkspaceRole" }
        canManage: { type: boolean }
        clients:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembershipClient"
        members:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMember"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceInvitation"
    WorkspaceInvitationInput:
      type: object
      required: [email, role, clientIds]
      properties:
        email: { type: string, minLength: 3, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        role: { $ref: "#/components/schemas/WorkspaceAssignableRole" }
        clientIds:
          type: array
          minItems: 1
          items: { type: number }
    WorkspaceMemberUpdate:
      type: object
      required: [role, clientIds]
      properties:
        role: { $ref: "#/components/schemas/WorkspaceAssignableRole" }
        clientIds:
          type: array
          minItems: 1
          items: { type: number }
    UsageMetric:
      type: object
      required: [used, limit, percentage, status]
      properties:
        used: { type: number }
        limit: { type: number }
        percentage: { type: number }
        status: { type: string, enum: [healthy, approaching, at_limit] }
    EvidenceUsage:
      type: object
      required: [documents, bytes, limitBytes, percentage, status]
      properties:
        documents: { type: number }
        bytes: { type: number }
        limitBytes: { type: number }
        percentage: { type: number }
        status: { type: string, enum: [healthy, approaching, at_limit] }
    WorkspaceUsage:
      type: object
      required: [plan, asOf, billingPeriod, statementImports, storedEvidence, aiActivity, aiCost, clientAiCosts, clientWorkspaces, retention]
      properties:
        plan: { type: string }
        asOf: { type: string, format: date-time }
        billingPeriod:
          type: object
          required: [label, startsAt]
          properties:
            label: { type: string }
            startsAt: { type: string, format: date-time }
        statementImports:
          allOf:
            - $ref: "#/components/schemas/UsageMetric"
        storedEvidence:
          $ref: "#/components/schemas/EvidenceUsage"
        aiActivity:
          allOf:
            - $ref: "#/components/schemas/UsageMetric"
        aiCost:
          $ref: "#/components/schemas/AICostSummary"
        clientAiCosts:
          type: array
          items:
            $ref: "#/components/schemas/ClientAICostUsage"
        clientWorkspaces:
          allOf:
            - $ref: "#/components/schemas/UsageMetric"
        retention:
          type: object
          required: [statementEvidenceDays, aiActivityDays, ledgerDataDescription]
          properties:
            statementEvidenceDays: { type: number }
            aiActivityDays: { type: number }
            ledgerDataDescription: { type: string }
    AICostModelUsage:
      type: object
      required: [provider, model, activityCount, estimatedCostUsd]
      properties:
        provider: { type: string }
        model: { type: string }
        activityCount: { type: number }
        estimatedCostUsd: { type: number }
    AICostSummary:
      type: object
      required: [completedActivities, activitiesWithEstimate, activitiesWithoutEstimate, replitPricedActivities, providerDirectPricedActivities, inputTokens, outputTokens, estimatedReplitCreditsUsd, estimatedProviderDirectUsd, estimatedTotalProviderCostUsd, models]
      properties:
        completedActivities: { type: number }
        activitiesWithEstimate: { type: number }
        activitiesWithoutEstimate: { type: number }
        replitPricedActivities: { type: number }
        providerDirectPricedActivities: { type: number }
        inputTokens: { type: number }
        outputTokens: { type: number }
        estimatedReplitCreditsUsd: { type: number }
        estimatedProviderDirectUsd: { type: number }
        estimatedTotalProviderCostUsd: { type: number }
        models:
          type: array
          items:
            $ref: "#/components/schemas/AICostModelUsage"
    ClientAICostUsage:
      type: object
      required: [clientId, clientName, usage]
      properties:
        clientId: { type: number }
        clientName: { type: string }
        usage:
          $ref: "#/components/schemas/AICostSummary"
    ExchangeRate:
      type: object
      required: [id, sourceCurrency, functionalCurrency, effectiveDate, rate, source]
      properties:
        id: { type: number }
        sourceCurrency: { type: string, minLength: 3, maxLength: 3 }
        functionalCurrency: { type: string, minLength: 3, maxLength: 3 }
        effectiveDate: { type: string, format: date }
        rate: { type: number, exclusiveMinimum: 0 }
        source: { type: string }
        note: { type: ["string", "null"] }
    ExchangeRateInput:
      type: object
      required: [sourceCurrency, functionalCurrency, effectiveDate, rate]
      properties:
        sourceCurrency: { type: string, minLength: 3, maxLength: 3 }
        functionalCurrency: { type: string, minLength: 3, maxLength: 3 }
        effectiveDate: { type: string, format: date }
        rate: { type: number, exclusiveMinimum: 0 }
        source: { type: string }
        note: { type: ["string", "null"] }
    ExchangeRateUpdate:
      type: object
      required: [sourceCurrency, functionalCurrency, effectiveDate, rate]
      properties:
        sourceCurrency: { type: string, minLength: 3, maxLength: 3 }
        functionalCurrency: { type: string, minLength: 3, maxLength: 3 }
        effectiveDate: { type: string, format: date }
        rate: { type: number, exclusiveMinimum: 0 }
        source: { type: string }
        note: { type: ["string", "null"] }
    ExchangeRateImportInput:
      type: object
      required: [rates]
      properties:
        rates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExchangeRateInput"
    ExchangeRateImportResult:
      type: object
      required: [importedCount, updatedCount, rates]
      properties:
        importedCount: { type: number }
        updatedCount: { type: number }
        rates:
          type: array
          items:
            $ref: "#/components/schemas/ExchangeRate"
    ExchangeRateParseInput:
      type: object
      required: [clientId]
      properties:
        clientId: { type: number }
        content: { type: string, minLength: 1, maxLength: 120000 }
        fileBase64: { type: string, minLength: 1, maxLength: 20000000 }
        fileName: { type: string }
    ExchangeRateParseMapping:
      type: object
      required: [effectiveDate, sourceCurrency, functionalCurrency, rate, source, note]
      properties:
        effectiveDate: { type: ["string", "null"] }
        sourceCurrency: { type: ["string", "null"] }
        functionalCurrency: { type: ["string", "null"] }
        rate: { type: ["string", "null"] }
        source: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
    ExchangeRateParseResult:
      type: object
      required: [mapping, rates, warnings, unmappedColumns, confidence]
      properties:
        mapping:
          $ref: "#/components/schemas/ExchangeRateParseMapping"
        rates:
          type: array
          items:
            $ref: "#/components/schemas/ExchangeRateInput"
        warnings:
          type: array
          items: { type: string }
        unmappedColumns:
          type: array
          items: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
    LedgerOverview:
      type: object
      required: [period, currencies, totalLines, pendingReview, postedAmount, completionPercent, functionalCurrency, postedAmountFunctional, missingRateCount, missingRateCurrencies]
      properties:
        period: { type: string }
        currencies:
          type: array
          items: { type: string }
        totalLines: { type: number }
        pendingReview: { type: number }
        postedAmount: { type: number }
        completionPercent: { type: number }
        functionalCurrency: { type: string }
        postedAmountFunctional: { type: number }
        missingRateCount: { type: number }
        missingRateCurrencies:
          type: array
          items: { type: string }
    StatementLine:
      type: object
      required: [id, date, description, currency, amount, direction, status, source]
      properties:
        id: { type: number }
        bankAccountId: { type: ["number", "null"] }
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
        status: { type: string }
        source: { type: string }
        accountSuggestion: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        suggestionSource: { type: ["string", "null"] }
        supportingPatternCount: { type: ["number", "null"] }
        functionalCurrency: { type: ["string", "null"] }
        functionalAmount: { type: ["number", "null"] }
        exchangeRate: { type: ["number", "null"] }
        exchangeRateEffectiveDate: { type: ["string", "null"], format: date }
        exchangeRateStatus: { type: string }
    StatementLineInput:
      type: object
      required: [date, description, currency, amount, direction]
      properties:
        clientId: { type: number }
        bankAccountId: { type: ["number", "null"] }
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
    StatementImportInput:
