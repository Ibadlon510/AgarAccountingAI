              $ref: "#/components/schemas/LedgerflowAccountUpdate"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerflowAccount"
        "409":
          description: Referenced or protected account cannot be changed destructively
    delete:
      operationId: deleteLedgerflowAccount
      tags: [agaraccounting]
      summary: Delete an unreferenced client chart account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerflowAccountMutation"
      responses:
        "204":
          description: Account deleted
        "409":
          description: Protected or referenced accounts must be archived instead
  /agaraccounting/accounts/{id}/archive:
    post:
      operationId: archiveLedgerflowAccount
      tags: [agaraccounting]
      summary: Archive a client chart account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerflowAccountMutation"
      responses:
        "200":
          description: Archived account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerflowAccount"
        "409":
          description: Protected account cannot be archived
  /agaraccounting/uae-corporate-tax:
    get:
      operationId: getUaeCorporateTaxSummary
      tags: [agaraccounting]
      summary: Calculate an estimated standard UAE Corporate Tax summary from posted entries
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
        - name: period
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Decision-support UAE Corporate Tax estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UaeCorporateTaxSummary"
components:
  parameters:
    RateScopeClientId:
      name: clientId
      in: query
      required: false
      schema: { type: number }
      description: Company ledger whose persisted rate profile is being managed.
    RateScopeFirmId:
      name: firmId
      in: query
      required: false
      schema: { type: number }
      description: Accounting firm whose shared rate profile is being managed.
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    AccountProfile:
      type: object
      required: [email, firstName, lastName]
      properties:
        email: { type: ["string", "null"] }
        firstName: { type: string }
        lastName: { type: string }
    AccountProfileInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
    LedgerflowAccount:
      type: object
      required: [id, clientId, accountCode, accountName, displayName, statementSection, currentNonCurrent, cashFlowCategory, taxTreatment, isActive, isSystem, sortOrder, referenced]
      properties:
        id: { type: number }
        clientId: { type: number }
        accountCode: { type: string }
        accountName: { type: string }
        displayName: { type: string }
        statementSection: { type: string, enum: [asset, liability, equity, revenue, expense, oci] }
        currentNonCurrent: { type: string, enum: [current, non_current, not_applicable] }
        cashFlowCategory: { type: string, enum: [operating, investing, financing, non_cash] }
        oci: { type: string, enum: [yes, no] }
        relatedPartyCategory: { type: string }
        taxCategory: { type: string }
        taxTreatment:
          type: string
          enum: [ordinary_deductible, entertainment_limited, fully_non_deductible, review_required]
        taxTreatmentReason: { type: ["string", "null"] }
        isActive: { type: boolean }
        isSystem: { type: boolean }
        sortOrder: { type: number }
        noteNumber: { type: ["number", "null"] }
        referenced: { type: boolean }
        reviewRequired: { type: boolean }
    LedgerflowAccountInput:
      type: object
      required: [clientId, accountCode, accountName, displayName, statementSection, taxTreatment]
      properties:
        clientId: { type: number }
        accountCode: { type: string, minLength: 1, maxLength: 40 }
        accountName: { type: string, minLength: 1, maxLength: 160 }
        displayName: { type: string, minLength: 1, maxLength: 160 }
        statementSection: { type: string, enum: [asset, liability, equity, revenue, expense, oci] }
        currentNonCurrent: { type: string, enum: [current, non_current, not_applicable] }
        cashFlowCategory: { type: string, enum: [operating, investing, financing, non_cash] }
        oci: { type: string, enum: [yes, no] }
        relatedPartyCategory: { type: string }
        taxCategory: { type: string }
        taxTreatment:
          type: string
          enum: [ordinary_deductible, entertainment_limited, fully_non_deductible, review_required]
        taxTreatmentReason: { type: ["string", "null"] }
        noteNumber: { type: ["number", "null"] }
        sortOrder: { type: number }
    LedgerflowAccountUpdate:
      allOf:
        - $ref: "#/components/schemas/LedgerflowAccountInput"
    LedgerflowAccountMutation:
      type: object
      required: [clientId]
      properties:
        clientId: { type: number }
    UaeCorporateTaxAdjustment:
      type: object
      required: [label, treatment, accountingCost, permittedDeduction, addBack, reviewAmount]
      properties:
        label: { type: string }
        treatment: { type: string }
        accountingCost: { type: number }
        permittedDeduction: { type: number }
        addBack: { type: number }
        reviewAmount: { type: number }
    UaeCorporateTaxSummary:
      type: object
      required: [jurisdiction, estimateLabel, period, functionalCurrency, accountingProfitBeforeTax, mappedDeductibleExpenses, entertainmentAccountingCost, entertainmentPermittedDeduction, entertainmentAddBack, addBacks, otherAdjustments, estimatedTaxableIncome, thresholdAed, rate, standardEstimatedLiability, reviewRequiredAmount, unmappedAmount, post2023Period, assumptions, excludedReliefs, adjustments]
      properties:
        jurisdiction: { type: string, enum: [UAE] }
        estimateLabel: { type: string }
        period: { type: string }
        functionalCurrency: { type: string }
        accountingProfitBeforeTax: { type: number }
        mappedDeductibleExpenses: { type: number }
        entertainmentAccountingCost: { type: number }
        entertainmentPermittedDeduction: { type: number }
        entertainmentAddBack: { type: number }
        addBacks: { type: number }
        otherAdjustments: { type: number }
        estimatedTaxableIncome: { type: number }
        thresholdAed: { type: number }
        rate: { type: number }
        standardEstimatedLiability: { type: number }
        reviewRequiredAmount: { type: number }
        unmappedAmount: { type: number }
        post2023Period: { type: boolean }
        assumptions:
          type: array
          items: { type: string }
        excludedReliefs:
          type: array
          items: { type: string }
        adjustments:
          type: array
          items:
            $ref: "#/components/schemas/UaeCorporateTaxAdjustment"
    FirmProfile:
      type: object
      required: [id, name, legalName, systemRatesEnabled, reportAttributionEnabled]
      properties:
        id: { type: number }
        name: { type: string }
        legalName: { type: string }
        systemRatesEnabled:
          type: boolean
          description: Whether the system catalog may supply a fallback rate for this firm's clients.
        reportAttributionEnabled:
          type: boolean
          description: Whether eligible newly generated reports show the firm's name.
    FirmProfileInput:
      type: object
      required: [name, legalName]
      properties:
        name: { type: string, minLength: 1 }
        legalName: { type: string, minLength: 1 }
        systemRatesEnabled: { type: boolean }
        reportAttributionEnabled: { type: boolean }
    OrganizationMode:
      type: string
      enum: [company, firm, both]
    OrganizationRole:
      type: string
      enum: [owner, admin, accountant, bookkeeper]
    OwnershipStatus:
      type: string
      enum: [company_owned, firm_provisional]
    SubscriptionLiableParty:
      type: string
      enum: [company, firm]
    OrganizationOnboardingInput:
      type: object
