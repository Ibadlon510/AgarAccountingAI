openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ledgerflow
    description: Accounting workflow operations
  - name: auth
    description: Browser and mobile authentication endpoints
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [auth]
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [auth]
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect back to the safe in-app location
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [auth]
      summary: Clear the session and begin OIDC logout
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string, default: / }
      responses:
        "302":
          description: Redirect to the OIDC provider logout endpoint
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [auth]
      summary: Exchange a mobile OIDC authorization code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [auth]
      summary: Delete a mobile session token
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /clients:
    get:
      operationId: getClients
      tags: [ledgerflow]
      summary: List client workspaces
      responses:
        "200":
          description: Client workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [ledgerflow]
      summary: Create a client workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [ledgerflow]
      summary: Update a client workspace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateInput"
      responses:
        "200":
          description: Client workspace updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ledgerflow/overview:
    get:
      operationId: getLedgerOverview
      tags: [ledgerflow]
      summary: Get bookkeeping workflow overview
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Current workflow summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerOverview"
  /ledgerflow/bank-accounts:
    get:
      operationId: getBankAccounts
      tags: [ledgerflow]
      summary: List a client's bank accounts
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Client bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankAccount"
    post:
      operationId: createBankAccount
      tags: [ledgerflow]
      summary: Create a client bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountInput"
      responses:
        "201":
          description: Client bank account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
  /ledgerflow/statement-lines:
    get:
      operationId: getStatementLines
      tags: [ledgerflow]
      summary: List bank statement lines
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
        - name: currency
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Bank statement lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementLine"
    post:
      operationId: createStatementLine
      tags: [ledgerflow]
      summary: Add a bank statement line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementLineInput"
      responses:
        "201":
          description: Statement line created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementLine"
  /ledgerflow/import-statement:
    post:
      operationId: importStatement
      tags: [ledgerflow]
      summary: Extract statement lines from a PDF, CSV, or Excel file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementImportInput"
      responses:
        "200":
          description: The statement was already imported or contained only duplicate lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementImportResult"
        "201":
          description: Statement lines extracted and queued for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementImportResult"
  /ledgerflow/ai-chat:
    post:
      operationId: askLedgerflowAI
      tags: [ledgerflow]
      summary: Ask the AI assistant about a client workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIChatInput"
      responses:
        "200":
          description: Workspace-aware AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIChatResponse"
  /ledgerflow/ai-actions/confirm:
    post:
      operationId: confirmAICopilotAction
      tags: [ledgerflow]
      summary: Apply a user-confirmed AI bookkeeping proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AICopilotActionInput"
      responses:
        "200":
          description: AI action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AICopilotActionResult"
  /ledgerflow/journal-entries:
    get:
      operationId: getJournalEntries
      tags: [ledgerflow]
      summary: List journal entries
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
  /ledgerflow/journal-entries/{id}/approve:
    post:
      operationId: approveJournalEntry
      tags: [ledgerflow]
      summary: Approve a suggested journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveJournalEntryInput"
      responses:
        "200":
          description: Approved journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
  /ledgerflow/journal-entries/{id}/post:
    post:
      operationId: postJournalEntry
      tags: [ledgerflow]
      summary: Post an approved journal entry to the ledger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveJournalEntryInput"
      responses:
        "200":
          description: Posted journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "409":
          description: Journal entry must be approved before posting
  /ledgerflow/trial-balance:
    get:
      operationId: getTrialBalance
      tags: [ledgerflow]
      summary: Get trial balance
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrialBalanceRow"
  /ledgerflow/financial-statements:
    get:
      operationId: getFinancialStatements
      tags: [ledgerflow]
      summary: Get financial statement reports
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Income statement, balance sheet, and indirect cash flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialStatements"
components:
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Client:
      type: object
      required: [id, name, legalName, functionalCurrency, basis, period]
      properties:
        id: { type: number }
        name: { type: string }
        legalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
    ClientInput:
      type: object
      required: [name, legalName]
      properties:
        name: { type: string }
        legalName: { type: string }
    ClientUpdateInput:
      type: object
      required: [name, legalName, functionalCurrency, basis, period]
      properties:
        name: { type: string }
        legalName: { type: string }
        functionalCurrency: { type: string }
        basis: { type: string }
        period: { type: string }
    LedgerOverview:
      type: object
      required: [period, currencies, totalLines, pendingReview, postedAmount, completionPercent]
      properties:
        period: { type: string }
        currencies:
          type: array
          items: { type: string }
        totalLines: { type: number }
        pendingReview: { type: number }
        postedAmount: { type: number }
        completionPercent: { type: number }
    StatementLine:
      type: object
      required: [id, date, description, currency, amount, direction, status, source, suggestionSource, supportingPatternCount]
      properties:
        id: { type: number }
        bankAccountId: { type: ["number", "null"] }
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
        status: { type: string }
        source: { type: string }
        accountSuggestion: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        suggestionSource: { type: string, enum: [ai, heuristic, workspace_learning] }
        supportingPatternCount: { type: number }
    StatementLineInput:
      type: object
      required: [date, description, currency, amount, direction]
      properties:
        clientId: { type: number }
        bankAccountId: { type: ["number", "null"] }
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
    StatementImportInput:
      type: object
      required: [clientId, fileName, mimeType, contentBase64, currency]
      properties:
        clientId: { type: number }
        bankAccountId: { type: ["number", "null"] }
        fileName: { type: string }
        mimeType: { type: string }
        contentBase64: { type: string }
        currency: { type: string }
    StatementImportResult:
      type: object
      required: [fileName, importStatus, importedCount, duplicateCount, duplicateLines, lines]
      properties:
        fileName: { type: string }
        importStatus: { type: string, enum: [imported, imported_with_duplicates, duplicates_found, duplicate_file] }
        message: { type: string }
        importedCount: { type: number }
        duplicateCount: { type: number }
        duplicateLines:
          type: array
          items:
            $ref: "#/components/schemas/StatementImportDuplicate"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StatementLine"
        bankAccount:
          oneOf:
            - $ref: "#/components/schemas/BankAccount"
            - type: "null"
    StatementImportDuplicate:
      type: object
      required: [date, description, currency, amount, direction, existingLineId, reason]
      properties:
        date: { type: string }
        description: { type: string }
        currency: { type: string }
        amount: { type: number }
        direction: { type: string }
        existingLineId: { type: ["number", "null"] }
        reason: { type: string, enum: [already_imported, duplicate_in_file] }
    BankAccount:
      type: object
      required: [id, clientId, name, currency]
      properties:
        id: { type: number }
        clientId: { type: number }
        name: { type: string }
        bankName: { type: ["string", "null"] }
        accountNumberLast4: { type: ["string", "null"] }
        currency: { type: string }
    BankAccountInput:
      type: object
      required: [clientId, name, currency]
      properties:
        clientId: { type: number }
        name: { type: string, minLength: 1 }
        bankName: { type: ["string", "null"] }
        accountNumberLast4: { type: ["string", "null"], pattern: "^[0-9]{4}$" }
        currency: { type: string, minLength: 3, maxLength: 3 }
    ApproveJournalEntryInput:
      type: object
      required: [clientId]
      properties:
        clientId: { type: number }
    AIChatInput:
      type: object
      required: [clientId, message]
      properties:
        clientId: { type: number }
        message: { type: string }
    AIChatResponse:
      type: object
      required: [answer, context, recommendations]
      properties:
        answer: { type: string }
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/AICopilotRecommendation"
        context:
          type: object
          required: [clientName, pendingLines, postedLines]
          properties:
            clientName: { type: string }
            pendingLines: { type: number }
            postedLines: { type: number }
    AICopilotRecommendation:
      type: object
      required: [id, clientId, type, title, summary, requiresConfirmation]
      properties:
        id: { type: string }
        clientId: { type: number }
        type: { type: string, enum: [next_step, review_group, recode_lines, create_bank_account, bulk_approve_entries, bulk_post_entries] }
        title: { type: string }
        summary: { type: string }
        lineIds:
          type: array
          items: { type: number }
        entryIds:
          type: array
          items: { type: number }
        statementLineIds:
          type: array
          items: { type: number }
        entryCount: { type: number }
        lineCount: { type: number }
        fromStatus: { type: string }
        toStatus: { type: string }
        statusTransition:
          type: object
          required: [from, to]
          properties:
            from: { type: string }
            to: { type: string }
        accountSuggestion: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        suggestionSource: { type: string, enum: [ai, heuristic, workspace_learning] }
        supportingPatternCount: { type: number }
        bankAccount:
          oneOf:
            - $ref: "#/components/schemas/BankAccountDraft"
            - type: "null"
        requiresConfirmation: { type: boolean }
    BankAccountDraft:
      type: object
      required: [name, currency]
      properties:
        name: { type: string }
        bankName: { type: ["string", "null"] }
        accountNumberLast4: { type: ["string", "null"], pattern: "^[0-9]{4}$" }
        currency: { type: string }
    AICopilotActionInput:
      type: object
      required: [clientId, type]
      properties:
        clientId: { type: number }
        type: { type: string, enum: [recode_lines, create_bank_account, bulk_approve_entries, bulk_post_entries] }
        lineIds:
          type: array
          items: { type: number }
          maxItems: 100
        entryIds:
          type: array
          items: { type: number }
          maxItems: 100
        statementLineIds:
          type: array
          items: { type: number }
          maxItems: 100
        accountSuggestion: { type: ["string", "null"] }
        confidence: { type: ["number", "null"] }
        bankAccount:
          oneOf:
            - $ref: "#/components/schemas/BankAccountDraft"
            - type: "null"
    AICopilotActionResult:
      type: object
      required: [type, updatedLineCount, bankAccount]
      properties:
        type: { type: string }
        clientId: { type: number }
        entryIds:
          type: array
          items: { type: number }
        statementLineIds:
          type: array
          items: { type: number }
        entryCount: { type: number }
        lineCount: { type: number }
        fromStatus: { type: string }
        toStatus: { type: string }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
        updatedLineCount: { type: number }
        bankAccount:
          oneOf:
            - $ref: "#/components/schemas/BankAccount"
            - type: "null"
    JournalLine:
      type: object
      required: [account, debit, credit]
      properties:
        account: { type: string }
        debit: { type: number }
        credit: { type: number }
    JournalEntry:
      type: object
      required: [id, statementLineId, date, memo, currency, status, confidence, lines]
      properties:
        id: { type: number }
        statementLineId: { type: number }
        date: { type: string }
        memo: { type: string }
        currency: { type: string }
        status: { type: string }
        confidence: { type: number }
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalLine" }
    TrialBalanceRow:
      type: object
      required: [account, category, debit, credit, balance]
      properties:
        account: { type: string }
        category: { type: string }
        debit: { type: number }
        credit: { type: number }
        balance: { type: number }
    StatementSection:
      type: object
      required: [label, amount]
      properties:
        label: { type: string }
        amount: { type: number }
        children:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
    FinancialStatements:
      type: object
      required: [period, incomeStatement, balanceSheet, cashFlow]
      properties:
        period: { type: string }
        incomeStatement:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
        balanceSheet:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
        cashFlow:
          type: array
          items: { $ref: "#/components/schemas/StatementSection" }
