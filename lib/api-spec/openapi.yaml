openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agaraccounting
    description: Accounting workflow operations
  - name: auth
    description: Browser and mobile authentication endpoints
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: feedback
    description: Public feedback board reads and authenticated writes
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /agaraccounting/account-profile:
    patch:
      operationId: updateAgarAccountingAccountProfile
      tags: [agaraccounting]
      summary: Save the authenticated account owner's AgarAccounting AI System profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileInput"
      responses:
        "200":
          description: Account profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
  /workspace/firm-profile:
    get:
      operationId: getFirmProfile
      tags: [agaraccounting]
      summary: Get the bookkeeping firm's shared profile
      responses:
        "200":
          description: Firm profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmProfile"
    patch:
      operationId: updateFirmProfile
      tags: [agaraccounting]
      summary: Update the bookkeeping firm's shared identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmProfileInput"
      responses:
        "200":
          description: Firm profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmProfile"
  /organizations/context:
    get:
      operationId: getOrganizationContext
      tags: [agaraccounting]
      summary: Get the authenticated user's company and accounting-firm context
      responses:
        "200":
          description: Organization context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
  /organizations/onboarding:
    post:
      operationId: completeOrganizationOnboarding
      tags: [agaraccounting]
      summary: Complete company, accounting-firm, or dual onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationOnboardingInput"
      responses:
        "200":
          description: Organization onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
  /firms/{id}/invitations:
    post:
      operationId: inviteFirmMember
      tags: [agaraccounting]
      summary: Invite a member to an accounting firm
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInviteInput"
      responses:
        "201":
          description: Firm invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitation"
  /companies/{id}/firm-invitations:
    post:
      operationId: inviteAccountingFirm
      tags: [agaraccounting]
      summary: Invite an accounting firm administrator to serve a company
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmEngagementInviteInput"
      responses:
        "201":
          description: Accounting-firm invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitation"
  /companies/{id}/transfer-invitations:
    post:
      operationId: inviteCompanyOwnerTransfer
      tags: [agaraccounting]
      summary: Invite a client owner to accept a firm-created company
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInviteInput"
      responses:
        "201":
          description: Company transfer invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitation"
  /organization-invitations/{token}/accept:
    post:
      operationId: acceptOrganizationInvitation
      tags: [agaraccounting]
      summary: Accept a firm, engagement, or company-transfer invitation
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
  /engagements/{id}/nominations:
    post:
      operationId: nominateFirmEngagementMember
      tags: [agaraccounting]
      summary: Nominate a firm member for company access
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirmNominationInput"
      responses:
        "200":
          description: Engagement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmEngagement"
  /engagements/{id}/nominations/{userId}/approve:
    post:
      operationId: approveFirmEngagementMember
      tags: [agaraccounting]
      summary: Approve a nominated firm member for company access
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Engagement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmEngagement"
  /engagements/{id}/members/{userId}:
    delete:
      operationId: revokeFirmEngagementMember
      tags: [agaraccounting]
      summary: Revoke one firm's access to a company
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Firm-member access revoked
  /engagements/{id}:
    delete:
      operationId: revokeFirmEngagement
      tags: [agaraccounting]
      summary: End an accounting-firm engagement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Engagement revoked
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [auth]
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [auth]
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect back to the safe in-app location
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [auth]
      summary: Clear the session and begin OIDC logout
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string, default: / }
      responses:
        "302":
          description: Redirect to the OIDC provider logout endpoint
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [auth]
      summary: Exchange a mobile OIDC authorization code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [auth]
      summary: Delete a mobile session token
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /clients:
    get:
      operationId: getClients
      tags: [agaraccounting]
      summary: List client workspaces
      responses:
        "200":
          description: Client workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [agaraccounting]
      summary: Create a client workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [agaraccounting]
      summary: Update a client workspace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateInput"
      responses:
        "200":
          description: Client workspace updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /workspace/members:
    get:
      operationId: getWorkspaceMembers
      tags: [agaraccounting]
      summary: Review workspace members and invitations
      responses:
        "200":
          description: Workspace membership and client access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembers"
  /workspace/members/{userId}:
    patch:
      operationId: updateWorkspaceMember
      tags: [agaraccounting]
      summary: Update a member role and client access
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberUpdate"
      responses:
        "200":
          description: Updated workspace member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
    delete:
      operationId: removeWorkspaceMember
      tags: [agaraccounting]
      summary: Remove a workspace member
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Member removed
  /workspace/invitations:
    post:
      operationId: createWorkspaceInvitation
      tags: [agaraccounting]
      summary: Invite a teammate to the workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "502":
          description: Invitation email delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDeliveryError"
  /workspace/invitations/{id}:
    delete:
      operationId: revokeWorkspaceInvitation
      tags: [agaraccounting]
      summary: Revoke a pending workspace invitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Invitation revoked
  /workspace/invitations/{id}/resend:
    post:
      operationId: resendWorkspaceInvitation
      tags: [agaraccounting]
      summary: Resend a pending workspace invitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Invitation resent with a newly rotated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "502":
          description: Invitation email delivery failed after the secure link was rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDeliveryError"
  /workspace/invitations/{token}/accept:
    post:
      operationId: acceptWorkspaceInvitation
      tags: [agaraccounting]
      summary: Accept a workspace invitation
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
  /agaraccounting/usage:
    get:
      operationId: getAgarAccountingUsage
      tags: [agaraccounting]
      summary: Get server-measured workspace usage and plan limits
      responses:
        "200":
          description: Workspace usage and retention policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceUsage"
  /agaraccounting/exchange-rates:
    get:
      operationId: getExchangeRates
      tags: [agaraccounting]
      summary: List the authenticated workspace exchange-rate schedule
      parameters:
        - $ref: "#/components/parameters/RateScopeClientId"
        - $ref: "#/components/parameters/RateScopeFirmId"
      responses:
        "200":
          description: Workspace exchange rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExchangeRate"
    post:
      operationId: createExchangeRate
      tags: [agaraccounting]
      summary: Add a dated workspace exchange rate
      parameters:
        - $ref: "#/components/parameters/RateScopeClientId"
        - $ref: "#/components/parameters/RateScopeFirmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateInput"
      responses:
        "201":
          description: Exchange rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
  /agaraccounting/exchange-rates/{id}:
    patch:
      operationId: updateExchangeRate
      tags: [agaraccounting]
      summary: Edit a dated workspace exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateUpdate"
      responses:
        "200":
          description: Exchange rate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
    delete:
      operationId: deleteExchangeRate
      tags: [agaraccounting]
      summary: Remove a dated workspace exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Exchange rate deleted
  /agaraccounting/exchange-rates/import:
    post:
      operationId: importExchangeRates
      tags: [agaraccounting]
      summary: Import dated workspace exchange rates
      parameters:
        - $ref: "#/components/parameters/RateScopeClientId"
        - $ref: "#/components/parameters/RateScopeFirmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateImportInput"
      responses:
        "200":
          description: Exchange rates imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateImportResult"
  /agaraccounting/exchange-rates/parse:
    post:
      operationId: parseExchangeRates
      tags: [agaraccounting]
      summary: Prepare an exchange-rate import preview from CSV or Excel data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateParseInput"
      responses:
        "200":
          description: Detected exchange-rate mapping and parsed preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateParseResult"
  /agaraccounting/system-rates/dashboard:
    get:
      operationId: getSystemRateDashboard
      tags: [agaraccounting]
      summary: Get aggregated system exchange-rate health
      description: Restricted to explicitly entitled system administrators. This response contains aggregate coverage metrics only.
      responses:
        "200":
          description: Aggregated system-rate health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRateDashboard"
        "403":
          description: System administrator entitlement required
  /agaraccounting/system-admin/claim-initial-access:
    post:
      operationId: claimInitialSystemAdminAccess
      tags: [agaraccounting]
      summary: Claim the one-time initial system administrator entitlement
      description: Available only when no system administrator record has ever existed and the authenticated requester is the sole user.
      responses:
        "200":
          description: Initial system administrator entitlement granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAdminClaimResult"
        "409":
          description: Initial system administrator access is no longer available
  /agaraccounting/system-rates:
    get:
      operationId: getSystemRates
      tags: [agaraccounting]
      summary: List global fallback exchange rates
      responses:
        "200":
          description: Global fallback exchange rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemRate"
        "403":
          description: System administrator entitlement required
    post:
      operationId: createSystemRate
      tags: [agaraccounting]
      summary: Add a global fallback exchange rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemRateInput"
      responses:
        "201":
          description: Global fallback exchange rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRate"
        "403":
          description: System administrator entitlement required
    delete:
      operationId: clearSystemRates
      tags: [agaraccounting]
      summary: Clear all global fallback exchange rates
      description: Removes all global fallback rate records while retaining the rate table and audit history.
      responses:
        "200":
          description: Global fallback exchange rates cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRateClearResult"
        "403":
          description: System administrator entitlement required
  /agaraccounting/system-rates/{id}:
    patch:
      operationId: updateSystemRate
      tags: [agaraccounting]
      summary: Edit a global fallback exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemRateUpdate"
      responses:
        "200":
          description: Global fallback exchange rate updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRate"
        "403":
          description: System administrator entitlement required
    delete:
      operationId: deleteSystemRate
      tags: [agaraccounting]
      summary: Remove a global fallback exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Global fallback exchange rate deleted
        "403":
          description: System administrator entitlement required
  /agaraccounting/system-rates/import:
    post:
      operationId: importSystemRates
      tags: [agaraccounting]
      summary: Import dated global fallback exchange rates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemRateImportInput"
      responses:
        "200":
          description: Global fallback exchange rates imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRateImportResult"
        "403":
          description: System administrator entitlement required
  /agaraccounting/system-rates/parse:
    post:
      operationId: parseSystemRates
      tags: [agaraccounting]
      summary: Prepare a global fallback exchange-rate import preview from Excel data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemRateParseInput"
      responses:
        "200":
          description: Detected global exchange-rate mapping and parsed preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateParseResult"
        "403":
          description: System administrator entitlement required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /agaraccounting/overview:
    get:
      operationId: getLedgerOverview
      tags: [agaraccounting]
      summary: Get bookkeeping workflow overview
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Current workflow summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerOverview"
  /agaraccounting/bank-accounts:
    get:
      operationId: getBankAccounts
      tags: [agaraccounting]
      summary: List a client's bank accounts
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Client bank accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankAccount"
    post:
      operationId: createBankAccount
      tags: [agaraccounting]
      summary: Create a client bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankAccountInput"
      responses:
        "201":
          description: Client bank account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
  /agaraccounting/statement-lines:
    get:
      operationId: getStatementLines
      tags: [agaraccounting]
      summary: List bank statement lines
      parameters:
        - name: clientId
          in: query
          required: false
          schema: { type: number }
        - name: currency
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [inflow, outflow]
      responses:
        "200":
          description: Bank statement lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementLine"
    post:
      operationId: createStatementLine
      tags: [agaraccounting]
      summary: Add a bank statement line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementLineInput"
      responses:
        "201":
          description: Statement line created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementLine"
  /agaraccounting/statement-lines/{id}/contact:
    patch:
      operationId: linkStatementLineContact
      tags: [agaraccounting]
      summary: Link or clear a client contact on a statement line
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementLineContactInput"
      responses:
        "200":
          description: Statement line with updated contact link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementLine"
        "409":
          description: Approved or posted activity cannot be silently relinked
  /agaraccounting/contacts:
    get:
      operationId: getContacts
      tags: [agaraccounting]
      summary: List contacts for a client workspace
      parameters:
        - name: clientId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Client contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [agaraccounting]
      summary: Create a client customer or supplier contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /agaraccounting/contacts/{id}:
    patch:
      operationId: updateContact
      tags: [agaraccounting]
      summary: Update a client contact and its aliases
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /agaraccounting/contacts/merge/preview:
