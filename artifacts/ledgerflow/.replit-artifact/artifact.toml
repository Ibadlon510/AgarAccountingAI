kind = "web"
previewPath = "/"
title = "LedgerFlow"
description = "An AI-assisted bookkeeping workspace that turns multi-currency bank statement lines into reviewed journal entries, trial balances, and financial statements with clear auditability."
version = "1.0.0"
id = "artifacts/ledgerflow"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21293

[services.development]
run = "pnpm --filter @workspace/ledgerflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ledgerflow", "run", "build" ]
serve = "static"
publicDir = "artifacts/ledgerflow/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21293"
BASE_PATH = "/"
