kind = "web"
previewPath = "/"
title = "AgarAccounting AI System"
description = "AgarAccounting AI System turns multi-currency bank statement lines into reviewed journal entries, trial balances, and financial statements with clear auditability."
version = "1.0.0"
id = "artifacts/agaraccounting"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24514

[services.development]
run = "pnpm --filter @workspace/agaraccounting run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agaraccounting", "run", "build" ]
serve = "static"
publicDir = "artifacts/agaraccounting/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24514"
BASE_PATH = "/"
